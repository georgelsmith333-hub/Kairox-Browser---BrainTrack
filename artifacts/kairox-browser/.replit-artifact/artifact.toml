kind = "mobile"
previewPath = "/"
title = "Kairox Browser"
description = "A mobile browser shell for people who need more than browsing: isolated local profiles, privacy controls, network diagnostics, developer tools, research helpers, and a focused browsing workspace."
version = "1.0.0"
id = "artifacts/kairox-browser"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/" ]
localPort = 25420

[services.development]
run = "pnpm --filter @workspace/kairox-browser run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/kairox-browser", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/kairox-browser", "run", "serve" ]

[services.env]
PORT = "25420"
BASE_PATH = "/"
